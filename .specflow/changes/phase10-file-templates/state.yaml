  - at: 2026-10-16T04:02:15.599Z
    event: decision_required
    detail: |
      SPEC-22（file-templates）在 allowed_paths 内的实现已全部完成并验证，只剩一项需要人工授权：
      规格要求“快搜窗口结果行图标按扩展名、徽标为大写扩展名；文件模板按 Enter/Ctrl+Enter 不执行操作，
      底栏只显示 编辑 Ctrl+E / 关闭 Esc”，这些都落在 src/components/QuickSearchWindow.tsx，
      而该文件不在本任务 allowed_paths（它属于 formatted-copy-export 的范围）。
      按规则不越权修改，故写 needs_decision。后端已提供 kind='file' 与 fileExt，快搜只差渲染与按键处理。
      需要决策：授权本任务对 QuickSearchWindow.tsx 做最小修改（行图标/徽标/底栏/Enter 与 Ctrl+Enter 对 file 项空操作），
      或把这一条移交 formatted-copy-export；其余条目（tasks.md 3.1–3.8、3.10–3.12）已完成并勾选，3.9 保持未勾选，3.13 为实机项（pending_human）。

      已完成内容：
      - Schema v5：snippets 新增 file_* 列、file_rel_path 唯一索引、kind 约束触发器；迁移前备份 searchis.db.v4.bak；v3/v4 迁移链单事务。
      - 模板目录 `<应用数据目录>/templates/` 与 `.trash/`（0700）；启动与每次扫描补建分组目录；分组新建/重命名/移动/删除同步目录与文件相对路径（删除时上移并按 (2) 规则改名，失败整体撤销）。
      - 导入（多文件、20 MB 与 10,000 条上限、requestId 幂等、Key 自动生成与“自动导入”标记、保存元数据后清除）、新建空白 md/xlsx（umya-spreadsheet）。
      - 标题↔文件名联动与 (2) 后缀；先文件后数据库的补偿，撤销失败返回 TEMPLATE_RECONCILE_PENDING，由下次扫描收敛。
      - platform/files.rs：xdg-open、xdg-mime（2 秒超时+扩展名回退）、.desktop 枚举与 Exec 字段码替换、打开方式按扩展名记忆（settings.openWithByExtension）、kdialog/zenity 文件选择。
      - 扫描：纯函数核心（路径→inode→SHA-256 唯一候选）+ IO 层；缺失/恢复、新文件、新子目录成分组、超 3 层跳过、忽略规则、符号链接不跟随、500 条分批事务、并发合并、完成后计数提示、“重新扫描”。
      - 回收站：.trash/<id>.<ext>、还原（原分组不存在则未分组，重名加后缀）、彻底删除/清空/自动清理只删 .trash 内文件；SearchIndex 同步。
      - 前端：“+”菜单、新建空白 md/xlsx 对话框、拖入与选择文件导入、右栏文件模板视图（元数据表单、文件信息卡片、打开/打开方式…、导出与带格式复制禁用、右上角放入回收站、无敏感开关/预览）、列表扩展名图标与徽标、“文件缺失”标记、扫描摘要与“重新扫描”。
      - E2E 替身：e2e 构建里 template_open 与文件选择器只记录/读取文件（不启动外部应用、不弹对话框）。
