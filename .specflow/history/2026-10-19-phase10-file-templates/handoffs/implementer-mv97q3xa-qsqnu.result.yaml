outcome: needs_decision
summary: >-
  visual-foundation（SPEC-20）的所有内容都已实现，build 和 E2E 都通过。只有一项需要决策：
  两条 MUST 要求互相冲突。按 design-tokens.md 的规定，深色主按钮文字 #FFF8F2 放在主按钮底色
  #B95C3D 上，对比度只有 4.28:1，达不到“主按钮文字 ≥ 4.5:1（WCAG AA）”的要求。
  在没有决策之前，token 保持与表格逐项一致，没有自行改值。
  已完成内容：index.css 换成植物/暖炭两套不透明 token，并新增 highlight、icon-bg、btn-secondary-border、focus-ring、文件类型、语法高亮、radius-window/card/row/pill、font-heading/body/mono、grain-opacity；
  玻璃效果、氛围光、backdrop-filter 全部删除；Playfair Display 与 Source Sans 3 改为随包发货，Figtree 已删除；
  SVG 纸张颗粒层通过 ::after 实现，设置了 pointer-events:none；输入框改为填充底、胶囊形、2px 带偏移焦点光环；
  主按钮实心、次要按钮描边，每个界面最多一个主按钮；lucide 图标统一 1.5 线宽；动效设为快搜 120ms、弹出 180ms、管理窗口 220ms ease-out，并支持 reduced-motion；
  HeaderBar 已删除，三个按钮移到左栏底部，标题旁重复的设置按钮已删除；主题展示名改为“浅色 植物 / 深色 暖炭 / 跟随系统”，存储值不变；
  main 窗口 transparent=false；E2E 视觉探针改为断言新主题的不透明背景色。
decision_needed:
  question: 深色主按钮文字对比度 4.28:1 低于 4.5:1。应修改 token（同时回写 design-tokens.md），还是接受这项例外？
  options:
    - id: A (recommended)
      change: 深色 --color-btn-primary-bg 由 #B95C3D 改为 #B35838（4.57:1）。色相基本不变，悬停色 #A9522F 保持不变（5.07:1）。需 Planner 同步修改 docs/design/design-tokens.md。
    - id: B
      change: 深色主按钮底色直接采用现悬停色 #A9522F（5.07:1），悬停色另行加深。
    - id: C
      change: 接受例外，保持 #B95C3D，在 spec 中注明主按钮不受 AA 约束（不推荐，违反 Requirement“主题对比度达标”）。
  owner: Planner/人（design-tokens.md 与 specs/ 属于 Planner 专属工件，Implementer 不可修改）
