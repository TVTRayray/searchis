outcome: completed
summary: |
  SPEC-24 settings-backup（tasks 5.1–5.8）已实现；5.9 为实机项，未勾选。
  前端：设置从弹窗改为管理窗口内的设置视图 S1（SettingsView.tsx）。左栏复用 .manager-sidebar（同宽同样式），
  分节为 返回片段 / 快捷键与启动 / 粘贴行为 / 外观主题 / 文件与导出 / 检索与数据 / 备份与重置 / 关于；点击跳转，Esc 与“返回片段”回到管理视图。
  AboutModal 并入“关于”分节并删除（零引用）；Global Menu“关于”（menu-action about，命令 ID 不变）打开设置并定位到“关于”；菜单导入/导出定位到“备份与重置”。
  “文件与导出”：导出目录（默认显示解析后的 XDG 下载目录）、“选择…”（tauri-plugin-dialog，Rust 侧调用；失败时提示手动输入）、“恢复默认”、文件名规则、
  只读模板目录路径与“打开”（templates_dir_open → xdg-open）、“文件模板以明文存放，不受数据库加密保护”。settings.exportDir 经 settings_update 校验
  （绝对路径、存在、目录、可写；否则 VALIDATION_FAILED，保持原值）。App.updateConfig 现返回错误文案，并在 REVISION_CONFLICT 时刷新 revision 重试一次。
  后端：独立模块 src-tauri/src/backup（v1/v2 JSON 解析校验、zip 结构/路径/符号链接/多余文件/哈希/大小校验、解压、zip 写入）；
  storage/backup.rs（apply_import 单事务、reset_all 单事务）；service/backup.rs（导出、校验、导入、重置、启动清理、设置路径）。
  导出：searchis-backup-YYYYMMDD-HHmmss.zip（由保存对话框给出默认名），backup.json(schemaVersion 2: groups/snippets/settings，去掉 exportDir/openWithByExtension/onboardingCompletedAt) + templates/（含 .trash/）；
  文件元数据以导出时实际读取的字节为准；backup.json ≤ 100 MB、zip ≤ 1 GB，超限拒绝并显示估算大小；含敏感片段二次确认；临时文件 + 不覆盖改名（RENAME_NOREPLACE）；0600。
  导入：接受 v2 zip 与 v1 JSON（全部视为未分组 plain 文本）；校验阶段拒绝绝对路径、..、反斜杠、符号链接、templates/ 之外内容、多余/缺失文件、大小或 SHA-256 不符，
  返回 BACKUP_ARCHIVE_INVALID；单文件 ≤ 20 MB、总量 ≤ 1 GB、条目 ≤ 20,000（IMPORT_TOO_LARGE）；解压到 <应用数据目录>/import-staging-<token>/；
  预览（新增/更新/分组/模板/Key 冲突）后由用户确认；冲突须显式选择覆盖（IMPORT_CONFLICT），分组按 ID 合并、同级重名加 (2)；导入期间持有模板目录锁（暂停扫描）并显示进度遮罩；
  同 token 只提交一次（重复提交返回同一结果）；启动时清理遗留 import-staging-* 与中断的重置。
  重置：确认文案注明删除文件模板；模板目录先改名为 templates-reset-<uuid>，数据库单事务（清空条目、分组及幂等记录并写入示例）成功后删除，失败改回；启动时恢复中断的重置。
  设计取舍（需 reviewer 知悉）：契约写作“数据库事务成功后再移入模板目录，失败用补偿事务回滚”。实现改为在同一个尚未提交的事务内，于全部数据库写入之后、COMMIT 之前把文件移入模板目录，
  任何一步失败即 ROLLBACK 并撤销文件操作（新文件删除、被覆盖的旧文件从暂存挪回、本次新建的空目录移除）。外部可见保证相同（失败时数据库与模板目录保持原状、临时目录被清理），且无需事后对已提交事务做补偿。
  行为变更提示：reset_examples 此前只是写入示例（不删除）；按 PRD FR-DAT-03 现在会清空全部条目与分组。
