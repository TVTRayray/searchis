summary: >-
  修复 reviewer-mv98dk0k-znn1r 的 F1–F3（accessibility），未改批准的 token 表，未扩张业务行为。
  F1：快搜搜索图标与输入框包进填充底胶囊 .quick-search-field（--color-field，38px，pill 圆角），
  焦点环画在 .quick-search-field:focus-within（2px solid --color-focus-ring，offset 2px）；
  输入框本身保持无边框、无 outline，避免双环；删除原先强制 outline:none !important 的覆盖。
  E2E 旧的「无焦点环」断言替换为正向断言（容器填充底 = field token、outline solid、宽度 2px（按设备像素取整）、
  offset 2px、颜色 = focus-ring token、输入框边框 0）。
  F2：reduced-motion 媒体块内新增 .theme-transition 及其后代 / ::before / ::after 的 transition:none !important
  （同 specificity、源码在后，胜出）；ThemeProvider 在 reduce 时不再添加 theme-transition class（双保险）。
  E2E 新增回归：手动挂上 theme-transition 后测按钮/列表行等 computed transition-duration；
  本机原生 prefers-reduced-motion=reduce，测得的是真实 cascade。
  F3：三处 placeholder（管理过滤框、编辑输入框/textarea、快搜输入框）改用 --color-fg-secondary；
  浅/深在 field 底 6.69/7.25、surface 底 7.70/8.31。E2E 新增回归：样式表中所有 ::placeholder 规则必须用
  secondary，且浅/深两套 token 配对在运行时计算 ≥ 4.5:1。
