[package]
name = "searchis"
version = "0.1.0"
description = "Local-first encrypted text snippet manager"
edition = "2021"

[lib]
name = "searchis_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "searchis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
libc = "0.2"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
